# Local stack: Postgres + web + separate durable worker.
# docker compose up --build   then open http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mc
      POSTGRES_PASSWORD: mc_local_only
      POSTGRES_DB: missioncontrol
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc -d missioncontrol"]
      interval: 5s
      retries: 10
  web:
    build: { context: ., target: runtime }
    depends_on: { db: { condition: service_healthy } }
    environment: &env
      DATABASE_URL: postgres://mc:mc_local_only@db:5432/missioncontrol
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DEMO_MODE: "true"
      EMBEDDED_WORKER: "false"
      LIVE_EXTERNAL_ACTIONS_ENABLED: "false"
      # Local-only values; real deployments inject these from a secret manager.
      SESSION_SECRET: local-compose-session-secret-change-me-0000
      INTEGRATION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NODE_ENV: production
    ports: ["3000:3000"]
  worker:
    build: { context: ., target: worker }
    depends_on: { db: { condition: service_healthy } }
    environment: *env
volumes:
  pgdata:
